<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кофе">
<meta name="theme-color" content="#e7dcc6">
<title>Кофейный журнал</title>
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" id="apple-icon">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=EB+Garamond:wght@400;500&display=swap');

:root {
  --bg: #e7dcc6;       /* warm beige page */
  --bg2: #ece3d1;      /* tab strip */
  --bg3: #f6f0e3;      /* input fields */
  --card: #f8f3e8;     /* cards */
  --card2: #f1e8d6;
  --border: rgba(74,54,33,0.13);
  --border2: rgba(74,54,33,0.24);
  --accent: #9a6b3c;   /* coffee brown */
  --accent2: #7c5530;  /* darker brown for text on accent bg */
  --gold: #c08a2e;     /* stars / notes */
  --ink: #3b2c1c;      /* espresso text */
  --muted: #8a7256;    /* muted brown */
  --cream-on-accent: #fdf8ee;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; font-weight: 400; overscroll-behavior: none; }
body { padding-top: env(safe-area-inset-top); padding-bottom: calc(env(safe-area-inset-bottom) + 40px); }

.header { position: sticky; top: env(safe-area-inset-top); z-index: 100; background: rgba(231,220,198,0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 0.5px solid var(--border); padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; color: var(--accent2); letter-spacing: 0.005em; }
.header-count { font-family: 'EB Garamond', serif; font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }

.tabs { display: flex; background: var(--bg2); border-bottom: 0.5px solid var(--border); position: sticky; top: calc(env(safe-area-inset-top) + 56px); z-index: 99; }
.tab { flex: 1; padding: 13px 8px; text-align: center; font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer; border: none; background: none; transition: color 0.2s; border-bottom: 2px solid transparent; -webkit-appearance: none; }
.tab.active { color: var(--accent2); border-bottom-color: var(--accent); }

.panel { display: none; padding: 20px 16px; }
.panel.active { display: block; }

.form-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(74,54,33,0.04); }
.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field label { display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', serif; font-size: 13px; font-weight: 500; color: var(--accent2); letter-spacing: 0.02em; margin-bottom: 8px; }
.field input, .field textarea { width: 100%; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 10px; padding: 11px 14px; font-size: 17px; font-family: 'EB Garamond', serif; font-weight: 400; color: var(--ink); outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { height: 70px; resize: none; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: 0.7; }
.field-target.flash { box-shadow: 0 0 0 2px var(--accent); border-radius: 10px; transition: box-shadow 0.2s; }

.upload-wrap { border: 1.5px dashed var(--border2); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s; position: relative; background: var(--bg3); }
.upload-wrap:hover { border-color: var(--accent); }
.upload-placeholder { padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 9px; color: var(--muted); }
.upload-placeholder svg { opacity: 0.6; }
.upload-placeholder span { font-size: 15px; }
.upload-preview { width: 100%; max-height: 220px; object-fit: cover; display: none; border-radius: 10px; }
.upload-wrap input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.ocr-status { margin-top: 10px; font-size: 15px; color: var(--accent2); display: none; align-items: center; gap: 8px; }
.ocr-status.show { display: flex; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.ocr-lines { margin-top: 12px; display: none; }
.ocr-lines.show { display: block; }
.ocr-lines-title { font-family: 'Fraunces', serif; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ocr-line { display: flex; align-items: center; gap: 8px; background: var(--card2); border: 0.5px solid var(--border); border-radius: 8px; padding: 7px 8px 7px 11px; margin-bottom: 6px; }
.ocr-line-text { flex: 1; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ocr-mini { flex-shrink: 0; font-family: 'EB Garamond', serif; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid var(--border2); background: var(--bg3); color: var(--accent2); cursor: pointer; -webkit-appearance: none; transition: all 0.15s; }
.ocr-mini:active { background: var(--accent); color: var(--cream-on-accent); }

.stars-row { display: flex; gap: 10px; padding: 4px 0; }
.star-btn { font-size: 32px; cursor: pointer; color: var(--border2); transition: color 0.15s, transform 0.1s; line-height: 1; user-select: none; -webkit-user-select: none; background: none; border: none; padding: 0; -webkit-appearance: none; }
.star-btn.on { color: var(--gold); }
.star-btn:active { transform: scale(0.88); }

.btn-submit { width: 100%; padding: 16px; background: var(--accent); color: var(--cream-on-accent); font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; border: none; border-radius: 12px; cursor: pointer; letter-spacing: 0.02em; transition: background 0.2s, transform 0.1s; -webkit-appearance: none; }
.btn-submit:active { transform: scale(0.98); background: var(--accent2); }

.sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.sort-bar::-webkit-scrollbar { display: none; }
.sort-chip { flex-shrink: 0; padding: 6px 15px; border-radius: 20px; font-family: 'EB Garamond', serif; font-size: 14px; font-weight: 400; color: var(--muted); border: 0.5px solid var(--border2); background: var(--card); cursor: pointer; transition: all 0.15s; white-space: nowrap; -webkit-appearance: none; }
.sort-chip.active { background: var(--accent); color: var(--cream-on-accent); border-color: var(--accent); font-weight: 500; }

.coffee-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 500px) { .coffee-grid { grid-template-columns: repeat(3, 1fr); } }
.coffee-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; position: relative; box-shadow: 0 1px 3px rgba(74,54,33,0.05); animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.coffee-photo { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.coffee-nophoto { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--card2); font-size: 36px; }
.coffee-info { padding: 11px 12px 13px; }
.coffee-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.coffee-place { font-size: 13px; color: var(--muted); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coffee-notes { font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px; color: var(--accent); margin-bottom: 8px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.coffee-stars { display: flex; gap: 2px; }
.coffee-stars span { font-size: 13px; }
.coffee-stars .s-on { color: var(--gold); }
.coffee-stars .s-off { color: var(--border2); }
.badge-score { position: absolute; top: 8px; right: 8px; background: rgba(59,44,28,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--cream-on-accent); font-family: 'Fraunces', serif; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
.del-btn { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(59,44,28,0.6); border: none; color: rgba(253,248,238,0.9); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; -webkit-appearance: none; }
.coffee-card:hover .del-btn { opacity: 1; }
@media (hover: none) { .del-btn { opacity: 0.65; } }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-family: 'Fraunces', serif; font-size: 16px; line-height: 1.6; }

.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 30px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--cream-on-accent); padding: 11px 22px; border-radius: 22px; font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 1000; box-shadow: 0 4px 14px rgba(74,54,33,0.18); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-overlay { position: fixed; inset: 0; background: rgba(40,28,16,0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 2000; display: none; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top) + 24px) 16px 24px; overflow-y: auto; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border: 0.5px solid var(--border2); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 12px 40px rgba(40,28,16,0.3); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-head h2 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--accent2); }
.modal-close { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; line-height: 1; padding: 0 4px; -webkit-appearance: none; }
.modal-photo { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; display: none; }
.modal-photo-edit { position: relative; }
.modal-rephoto { display: inline-block; font-family: 'EB Garamond', serif; font-size: 13px; color: var(--accent); cursor: pointer; margin-bottom: 14px; border-bottom: 0.5px solid var(--accent); }
.modal-rephoto input { display: none; }
.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.modal-btn-save { flex: 1; padding: 14px; background: var(--accent); color: var(--cream-on-accent); font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; border: none; border-radius: 12px; cursor: pointer; -webkit-appearance: none; transition: background 0.2s, transform 0.1s; }
.modal-btn-save:active { transform: scale(0.98); background: var(--accent2); }
.modal-btn-del { padding: 14px 16px; background: none; color: #a8472e; font-family: 'EB Garamond', serif; font-size: 15px; border: 0.5px solid rgba(168,71,46,0.4); border-radius: 12px; cursor: pointer; -webkit-appearance: none; }
.modal-btn-del:active { background: rgba(168,71,46,0.08); }

.install-hint { background: var(--card2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
.install-hint-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.install-hint-text { font-size: 15px; color: var(--muted); line-height: 1.55; }
.install-hint-text strong { color: var(--accent2); font-weight: 500; }
.install-hint-close { margin-left: auto; flex-shrink: 0; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 0 0 8px; line-height: 1; -webkit-appearance: none; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
  <div class="header-title">Кофейный журнал</div>
  <div class="header-count" id="header-count"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('add')">Добавить</button>
  <button class="tab" onclick="switchTab('list')">Моя коллекция</button>
</div>

<div class="panel active" id="panel-add">
  <div class="install-hint" id="install-hint" style="display:none">
    <div class="install-hint-icon">📱</div>
    <div class="install-hint-text">Чтобы добавить на экран iPhone: нажми <strong>Поделиться</strong> в Safari, затем — <strong>На экран «Домой»</strong>.</div>
    <button class="install-hint-close" onclick="hideHint()">×</button>
  </div>

  <div class="form-card">
    <div class="field">
      <label>Фото пачки</label>
      <div class="upload-wrap" id="upload-wrap">
        <div class="upload-placeholder" id="upload-placeholder">
          <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <span>Нажми, чтобы выбрать фото</span>
        </div>
        <img id="preview" class="upload-preview" alt="">
        <input type="file" accept="image/*" id="file-input">
      </div>
      <div class="ocr-status" id="ocr-status"><span class="spinner"></span><span id="ocr-status-text">Распознаём текст…</span></div>
      <div class="ocr-lines" id="ocr-lines">
        <div class="ocr-lines-title">Найдено на фото — назначь строки кнопками:</div>
        <div id="ocr-lines-list"></div>
      </div>
    </div>

    <div class="field field-target" id="ft-name">
      <label>Название / сорт</label>
      <input type="text" id="inp-name" placeholder="заполнится с фото" autocomplete="off">
    </div>
    <div class="field field-target" id="ft-notes">
      <label>Ноты вкуса</label>
      <input type="text" id="inp-notes" placeholder="например: цитрус, персик, цветы" autocomplete="off">
    </div>
    <div class="field">
      <label>Кофейня</label>
      <input type="text" id="inp-place" placeholder="где купила?" autocomplete="off">
    </div>
    <div class="field">
      <label>Заметка</label>
      <textarea id="inp-note" placeholder="что запомнилось..."></textarea>
    </div>
    <div class="field">
      <label>Оценка</label>
      <div class="stars-row" id="stars-row">
        <button class="star-btn" data-v="1">★</button>
        <button class="star-btn" data-v="2">★</button>
        <button class="star-btn" data-v="3">★</button>
        <button class="star-btn" data-v="4">★</button>
        <button class="star-btn" data-v="5">★</button>
      </div>
    </div>
  </div>

  <button class="btn-submit" id="btn-submit">Сохранить в журнал</button>
</div>

<div class="panel" id="panel-list">
  <div class="sort-bar">
    <button class="sort-chip active" data-sort="rating-desc">★ Лучшие</button>
    <button class="sort-chip" data-sort="rating-asc">↑ По оценке</button>
    <button class="sort-chip" data-sort="date-desc">Новые</button>
    <button class="sort-chip" data-sort="date-asc">Старые</button>
  </div>
  <div class="coffee-grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none">
    <div class="emoji">☕</div>
    <p>Пока нет записей.<br>Добавь свой первый кофе!</p>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Редактировать</h2>
      <button class="modal-close" onclick="closeEdit()" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-photo-edit">
      <img id="edit-photo" class="modal-photo" alt="">
    </div>
    <label class="modal-rephoto">Заменить фото
      <input type="file" accept="image/*" id="edit-file">
    </label>
    <div class="field">
      <label>Название / сорт</label>
      <input type="text" id="edit-name" autocomplete="off">
    </div>
    <div class="field">
      <label>Ноты вкуса</label>
      <input type="text" id="edit-notes" autocomplete="off">
    </div>
    <div class="field">
      <label>Кофейня</label>
      <input type="text" id="edit-place" autocomplete="off">
    </div>
    <div class="field">
      <label>Заметка</label>
      <textarea id="edit-note"></textarea>
    </div>
    <div class="field">
      <label>Оценка</label>
      <div class="stars-row" id="edit-stars">
        <button class="star-btn" data-v="1">★</button>
        <button class="star-btn" data-v="2">★</button>
        <button class="star-btn" data-v="3">★</button>
        <button class="star-btn" data-v="4">★</button>
        <button class="star-btn" data-v="5">★</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-del" onclick="deleteFromEdit()">Удалить</button>
      <button class="modal-btn-save" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const KEY = 'cj_entries_v1';
const HINT_KEY = 'cj_hint_hidden';
let entries = [];
let rating = 0;
let imgData = null;
let currentSort = 'rating-desc';

function load() { try { const d = localStorage.getItem(KEY); if (d) entries = JSON.parse(d); } catch(e) { entries = []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch(e) {} }

function showInstallHint() {
  const hidden = localStorage.getItem(HINT_KEY);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!hidden && isIOS && !window.navigator.standalone) document.getElementById('install-hint').style.display = 'flex';
}
window.hideHint = function() { localStorage.setItem(HINT_KEY, '1'); document.getElementById('install-hint').style.display = 'none'; };

window.switchTab = function(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='add')||(i===1&&tab==='list')));
  document.getElementById('panel-add').classList.toggle('active', tab==='add');
  document.getElementById('panel-list').classList.toggle('active', tab==='list');
  if (tab === 'list') render();
};

function setRating(v) { rating = v; document.querySelectorAll('.star-btn').forEach(s => s.classList.toggle('on', +s.dataset.v <= v)); }
document.getElementById('stars-row').addEventListener('click', e => { const s = e.target.closest('.star-btn'); if (s) setRating(+s.dataset.v); });

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const full = ev.target.result;
    const prev = document.getElementById('preview');
    prev.src = full; prev.style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
    imgData = await downscale(full, 900);
    runOCR(full);
  };
  reader.readAsDataURL(f);
});

function downscale(dataUrl, maxW) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.src = dataUrl;
  });
}

async function runOCR(dataUrl) {
  if (typeof Tesseract === 'undefined') return;
  const status = document.getElementById('ocr-status');
  const statusText = document.getElementById('ocr-status-text');
  document.getElementById('ocr-lines').classList.remove('show');
  status.classList.add('show');
  statusText.textContent = 'Распознаём текст…';
  try {
    const small = await downscale(dataUrl, 1500);
    const { data } = await Tesseract.recognize(small, 'eng', {
      logger: m => { if (m.status === 'recognizing text') statusText.textContent = 'Распознаём текст… ' + Math.round(m.progress*100) + '%'; }
    });
    const lines = (data.lines || []).map(l => l.text.replace(/\s+/g, ' ').trim()).filter(t => t.length >= 2 && /[a-zA-Zа-яА-Я]/.test(t));
    status.classList.remove('show');
    if (!lines.length) { showToast('Текст не распознан — впиши вручную'); return; }
    autoFill(lines); showLines(lines);
  } catch (err) {
    status.classList.remove('show');
    showToast('Не удалось распознать — впиши вручную');
  }
}

function titleCase(s) { return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }

function autoFill(lines) {
  let notesLine = null, maxCommas = 0;
  lines.forEach(l => { const c = (l.match(/,/g)||[]).length; if (c >= 2 && c > maxCommas) { maxCommas = c; notesLine = l; } });
  let nameLine = lines.find(l => l !== notesLine && l.length >= 4 && (l.match(/,/g)||[]).length < 2);
  if (nameLine && !document.getElementById('inp-name').value) { document.getElementById('inp-name').value = titleCase(nameLine); flash('ft-name'); }
  if (notesLine && !document.getElementById('inp-notes').value) { document.getElementById('inp-notes').value = titleCase(notesLine); flash('ft-notes'); }
}

function flash(id) { const el = document.getElementById(id); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 700); }

function showLines(lines) {
  const list = document.getElementById('ocr-lines-list');
  list.innerHTML = lines.map((l, i) => `
    <div class="ocr-line">
      <span class="ocr-line-text" title="${l.replace(/"/g,'&quot;')}">${l}</span>
      <button class="ocr-mini" data-i="${i}" data-target="name">Название</button>
      <button class="ocr-mini" data-i="${i}" data-target="notes">Ноты</button>
    </div>`).join('');
  list.querySelectorAll('.ocr-mini').forEach(btn => {
    btn.addEventListener('click', () => {
      const txt = titleCase(lines[+btn.dataset.i]);
      if (btn.dataset.target === 'name') { document.getElementById('inp-name').value = txt; flash('ft-name'); }
      else { document.getElementById('inp-notes').value = txt; flash('ft-notes'); }
    });
  });
  document.getElementById('ocr-lines').classList.add('show');
}

document.getElementById('btn-submit').addEventListener('click', () => {
  const name = document.getElementById('inp-name').value.trim();
  if (!name) { document.getElementById('inp-name').focus(); showToast('Введи название кофе'); return; }
  entries.unshift({
    id: Date.now(), name,
    notes: document.getElementById('inp-notes').value.trim(),
    place: document.getElementById('inp-place').value.trim(),
    note: document.getElementById('inp-note').value.trim(),
    rating, img: imgData, date: Date.now()
  });
  save();
  ['inp-name','inp-notes','inp-place','inp-note'].forEach(id => document.getElementById(id).value = '');
  setRating(0); imgData = null;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('upload-placeholder').style.display = 'flex';
  document.getElementById('file-input').value = '';
  document.getElementById('ocr-lines').classList.remove('show');
  updateCount(); showToast('Кофе добавлен ☕'); switchTab('list');
});

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
window.deleteEntry = function(id) { entries = entries.filter(e => e.id !== id); save(); updateCount(); render(); };

let editingId = null;
let editRating = 0;
let editImg = null;

window.openEdit = function(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  editImg = e.img || null;
  editRating = e.rating || 0;
  document.getElementById('edit-name').value = e.name || '';
  document.getElementById('edit-notes').value = e.notes || '';
  document.getElementById('edit-place').value = e.place || '';
  document.getElementById('edit-note').value = e.note || '';
  const photo = document.getElementById('edit-photo');
  if (editImg) { photo.src = editImg; photo.style.display = 'block'; } else { photo.style.display = 'none'; }
  setEditRating(editRating);
  document.getElementById('edit-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
};

window.closeEdit = function() {
  document.getElementById('edit-modal').classList.remove('show');
  document.body.style.overflow = '';
  editingId = null;
  document.getElementById('edit-file').value = '';
};

function setEditRating(v) {
  editRating = v;
  document.querySelectorAll('#edit-stars .star-btn').forEach(s => s.classList.toggle('on', +s.dataset.v <= v));
}
document.getElementById('edit-stars').addEventListener('click', e => { const s = e.target.closest('.star-btn'); if (s) setEditRating(+s.dataset.v); });

document.getElementById('edit-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    editImg = await downscale(ev.target.result, 900);
    const photo = document.getElementById('edit-photo');
    photo.src = editImg; photo.style.display = 'block';
  };
  reader.readAsDataURL(f);
});

window.saveEdit = function() {
  const e = entries.find(x => x.id === editingId);
  if (!e) return;
  const name = document.getElementById('edit-name').value.trim();
  if (!name) { showToast('Введи название кофе'); return; }
  e.name = name;
  e.notes = document.getElementById('edit-notes').value.trim();
  e.place = document.getElementById('edit-place').value.trim();
  e.note = document.getElementById('edit-note').value.trim();
  e.rating = editRating;
  e.img = editImg;
  save(); render(); closeEdit(); showToast('Сохранено');
};

window.deleteFromEdit = function() {
  if (editingId == null) return;
  const id = editingId;
  closeEdit();
  deleteEntry(id);
  showToast('Удалено');
};

document.getElementById('edit-modal').addEventListener('click', e => { if (e.target.id === 'edit-modal') closeEdit(); });

function starsHtml(r) { let h = ''; for (let i = 1; i <= 5; i++) h += `<span class="${i<=r?'s-on':'s-off'}">★</span>`; return h; }

function getSorted() {
  const arr = [...entries];
  if (currentSort === 'rating-desc') arr.sort((a,b) => b.rating - a.rating);
  else if (currentSort === 'rating-asc') arr.sort((a,b) => a.rating - b.rating);
  else if (currentSort === 'date-desc') arr.sort((a,b) => b.date - a.date);
  else arr.sort((a,b) => a.date - b.date);
  return arr;
}

function render() {
  const sorted = getSorted();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!sorted.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = sorted.map(e => `
    <div class="coffee-card" onclick="openEdit(${e.id})">
      <button class="del-btn" onclick="event.stopPropagation(); deleteEntry(${e.id})" aria-label="Удалить">×</button>
      ${e.rating ? `<div class="badge-score">${e.rating}/5</div>` : ''}
      ${e.img ? `<img class="coffee-photo" src="${e.img}" alt="${e.name}" loading="lazy">` : `<div class="coffee-nophoto">☕</div>`}
      <div class="coffee-info">
        <div class="coffee-name" title="${e.name}">${e.name}</div>
        <div class="coffee-place">${e.place || '—'}</div>
        ${e.notes ? `<div class="coffee-notes">${e.notes}</div>` : ''}
        <div class="coffee-stars">${starsHtml(e.rating)}</div>
      </div>
    </div>`).join('');
}

document.querySelectorAll('.sort-chip').forEach(c => {
  c.addEventListener('click', () => {
    currentSort = c.dataset.sort;
    document.querySelectorAll('.sort-chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active'); render();
  });
});

function updateCount() { document.getElementById('header-count').textContent = entries.length ? `${entries.length} записей` : ''; }

function injectManifest() {
  const manifest = { name: 'Кофейный журнал', short_name: 'Кофе', start_url: '.', display: 'standalone', background_color: '#e7dcc6', theme_color: '#e7dcc6', icons: [ { src: generateIcon(192), sizes: '192x192', type: 'image/png' }, { src: generateIcon(512), sizes: '512x512', type: 'image/png' } ] };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
}
function generateIcon(size) {
  const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#9a6b3c'; ctx.fillRect(0,0,size,size);
  ctx.font = `${size*0.55}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('☕', size/2, size/2 + size*0.04);
  return canvas.toDataURL('image/png');
}
function setAppleIcon() { document.getElementById('apple-icon').href = generateIcon(180); }

load(); updateCount(); injectManifest(); setAppleIcon(); showInstallHint();
</script>
</body>
</html>
